<style>
/* Carta para mamá · un sobre que se abre, una carta que se escribe sola y fotos que caen. Licencia MIT. */
:root{
  --fondo:#3a1f2b; --fondo2:#5a2b3c; --papel:#fff8f2; --papel2:#f6ece2; --tinta:#3b2330; --suave:#7a5b68;
  --acento:#c9506e; --acento2:#f0b3a6; --marcador:rgba(242,160,184,.55); --lacre:#b2334f; --sobre:#f3d3cf;
  --linea:rgba(59,35,48,.11); --margen:rgba(201,80,110,.35);
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --mano:"Kalam","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --ui:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --lh:34px; --izq:58px;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{background:var(--fondo);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--fondo);color:var(--tinta);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acento2);outline-offset:3px}
[hidden]{display:none!important}
.fondo{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 80% at 50% 0%,var(--fondo2),var(--fondo) 70%)}
#petalos{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

/* ── el sobre ── */
.escena{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top, 0px)) var(--gr) calc(24px + env(safe-area-inset-bottom, 0px)) var(--gl);transition:opacity .5s ease}
.escena .ojo{margin:0;font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--acento2)}
.sobre{position:relative;width:min(86vw,420px);perspective:1200px;animation:llega 1.1s cubic-bezier(.2,.8,.2,1) both}
.sobre::before{content:"";display:block;padding-top:70%}
@keyframes llega{from{transform:translateY(40px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.sobre-atras{position:absolute;inset:0;border-radius:6px;background:var(--sobre);filter:brightness(.9);box-shadow:0 30px 60px -24px rgba(0,0,0,.65)}
.papelito{position:absolute;left:7%;right:7%;top:8%;height:84%;z-index:1;border-radius:3px;background-color:var(--papel);
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent 13px,var(--linea) 13px,var(--linea) 14px);background-position:0 20px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.bolsillo{position:absolute;inset:0;z-index:2;border-radius:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6%;
  background:linear-gradient(165deg,rgba(255,255,255,.28),transparent 45%),var(--sobre);
  -webkit-clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%);clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%)}
.para-sobre{font-family:var(--mano);font-weight:700;font-size:clamp(22px,6.4vw,34px);line-height:1.1;color:var(--tinta)}
.de-sobre{margin-top:4px;font-family:var(--mano);font-size:clamp(14px,3.9vw,18px);color:var(--suave)}
.solapa{position:absolute;left:0;right:0;top:0;height:52%;z-index:3;transform-origin:50% 0;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));
  transition:transform .8s cubic-bezier(.4,.1,.2,1),z-index 0s .36s}
.solapa i{position:absolute;inset:0;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--sobre),var(--sobre));filter:brightness(.96);
  -webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%)}
.lacre{position:absolute;left:50%;top:52%;z-index:4;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.38),transparent 46%),var(--lacre);
  box-shadow:0 5px 12px rgba(0,0,0,.35),inset 0 -3px 7px rgba(0,0,0,.28),0 0 0 5px rgba(0,0,0,.06);transition:transform .35s ease,opacity .35s ease}
.lacre svg{width:22px;height:22px;fill:rgba(255,255,255,.88)}
.lacre:hover{transform:scale(1.06)}
.abierto .lacre{transform:scale(1.5);opacity:0;pointer-events:none}
.abierto .solapa{transform:rotateX(180deg);z-index:0}
.sale .papelito{transform:translateY(-64%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:15px 28px;font-size:17px;font-weight:600;cursor:pointer;
  background:var(--papel);color:var(--tinta);box-shadow:0 14px 30px -14px rgba(0,0,0,.6);transition:transform .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:18px;height:18px;fill:currentColor}
.nota{margin:-12px 0 0;font-size:13px;color:rgba(255,255,255,.72)}
.probar{border:1px dashed rgba(255,255,255,.45);background:none;color:rgba(255,255,255,.85);border-radius:999px;padding:10px 18px;font-size:14px;cursor:pointer}
.escena.fuera{opacity:0;pointer-events:none}
.cortina{position:fixed;z-index:6;background:var(--papel);border-radius:3px;transition:all .75s cubic-bezier(.6,0,.2,1)}

/* ── la carta ── */
.carta{position:relative;z-index:1;max-width:720px;margin:0 auto;min-height:100vh;overflow-x:hidden;overflow-x:clip;
  background-color:var(--papel);
  background-image:linear-gradient(90deg,transparent calc(var(--izq) - 16px),var(--margen) calc(var(--izq) - 16px),var(--margen) calc(var(--izq) - 15px),transparent calc(var(--izq) - 15px)),
    repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--lh) - 1px),var(--linea) calc(var(--lh) - 1px),var(--linea) var(--lh));
  background-position:0 0,0 -7px;
  padding:calc(var(--lh) * 2 + env(safe-area-inset-top, 0px)) var(--gr) calc(var(--lh) * 4 + env(safe-area-inset-bottom, 0px)) var(--izq);
  box-shadow:0 0 90px rgba(0,0,0,.35);font-family:var(--mano);font-size:20px;line-height:var(--lh);color:var(--tinta)}
.carta p{margin:0 0 var(--lh)}
.fecha{text-align:right;color:var(--suave)}
.saludo{font-weight:700;font-size:23px}
.c{opacity:0}
.c.t{opacity:1;transition:opacity .18s ease}
.pluma{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.16em;background:var(--acento);animation:titila 1s steps(2) infinite}
@keyframes titila{50%{opacity:0}}
.palabra{white-space:nowrap}
.marca{background-image:linear-gradient(var(--marcador),var(--marcador));background-repeat:no-repeat;background-size:0% 60%;background-position:0 80%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size 1.3s ease;padding:0 .08em}
.marca.on{background-size:100% 60%}
.lista{list-style:none;margin:0 0 var(--lh);padding:0}
.lista li{position:relative;padding-left:1.25em}
.lista li::before{content:"♥";position:absolute;left:0;color:var(--acento);opacity:0;transition:opacity .4s}
.lista li.on::before{opacity:1}
.firma{text-align:right;font-weight:700}
.firma > span{display:block}
.pd{color:var(--suave);font-size:18px}

/* bloques que cortan la escritura: alto en múltiplos del renglón */
.bloque{position:relative;margin:0 0 var(--lh) calc(16px - var(--izq))}
.grande{text-align:center;font-family:var(--display);font-weight:400;color:var(--acento);font-size:clamp(46px,12.5vw,88px);line-height:1;letter-spacing:-.01em;
  display:flex;flex-direction:column;justify-content:center;opacity:0;transform:scale(.92);transition:opacity 1.2s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.grande.on{opacity:1;transform:none}
.grande small{display:block;margin-top:.25em;font-family:var(--mano);font-size:.36em;color:var(--suave);letter-spacing:0}

/* polaroid con cinta */
.pol{--alto:0;position:absolute;left:50%;top:50%;width:var(--w);margin:0;visibility:hidden;
  background:linear-gradient(160deg,#fffdf9,#f3ece2);padding:calc(var(--w) * .055) calc(var(--w) * .055) 0;border-radius:2px;
  box-shadow:0 calc(6px + var(--alto) * 40px) calc(14px + var(--alto) * 36px) -10px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.22)}
.pol::before{content:"";position:absolute;z-index:2;left:50%;top:calc(var(--w) * -.05);width:calc(var(--w) * .36);height:calc(var(--w) * .11);
  transform:translateX(-50%) rotate(-3deg);background:var(--acento2);opacity:.75;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pol:nth-child(even)::before{transform:translateX(-44%) rotate(4deg);background:#fff3d6}
.pol .foto{position:relative;padding-top:118%;overflow:hidden;background:var(--papel2)}
.pol .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pol figcaption{font-family:var(--mano);color:#3b2a30;font-size:calc(var(--w) * .085);line-height:1.1;min-height:calc(var(--w) * .2);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 6px}
.pol.rota{display:none}
.pol.vuela{visibility:visible;transition:transform .78s cubic-bezier(.22,.85,.3,1.14),box-shadow .78s ease}
.pol.ya{visibility:visible}
.corazon .pol{padding:calc(var(--w) * .07) calc(var(--w) * .07) calc(var(--w) * .2)}
.corazon .pol .foto{padding-top:100%}
.corazon .pol::before{display:none}

/* carrusel */
.carrusel{margin-left:calc(-1 * var(--izq));margin-right:calc(-1 * var(--gr));overflow:hidden;padding:18px 0 10px}
.fila{opacity:0;transform:translateX(26%);transition:opacity 1s ease,transform 1.3s cubic-bezier(.2,.7,.2,1)}
.fila.rev{transform:translateX(-26%)}
.fila.on{opacity:1;transform:none}
.fila + .fila{margin-top:16px}
.tira{display:flex;gap:16px;width:max-content;padding:0 8px;animation:desliza var(--dur,40s) linear infinite}
.fila.rev .tira{animation-direction:reverse}
.tira .pol{position:relative;left:auto;top:auto;flex:0 0 auto;visibility:visible;transform:rotate(var(--r))}
.tira .pol .foto{padding-top:100%}
@keyframes desliza{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.flor-sep{display:flex;justify-content:center;align-items:center;opacity:.85}
.flor-sep svg{width:120px;height:68px}

.fin{text-align:center;font-family:var(--ui);font-size:16px;line-height:1.5}
.fin .btn{background:var(--acento);color:#fff}
.hacer{margin:calc(var(--lh) * 2) 0 0;text-align:left;font-family:var(--ui);font-size:15px;line-height:1.55;color:var(--suave);background:var(--papel2);border-radius:14px;padding:18px 18px 16px}
.hacer b{color:var(--tinta)}
.hacer a{color:var(--acento)}

/* controles */
.controles{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;gap:6px;padding:6px;border-radius:999px;
  background:rgba(20,14,18,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.controles button{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:10px 14px;background:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.controles button:hover{background:rgba(255,255,255,.12)}
.controles svg{width:15px;height:15px;fill:currentColor}

@media (max-width:420px){
  :root{--lh:31px;--izq:46px}
  .carta{font-size:18.5px}
  .saludo{font-size:21px}
  .pd{font-size:17px}
  .controles button{padding:10px 11px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .sobre{animation:none}
  .tira{animation:none}
  .carrusel{overflow-x:auto}
  .pluma{animation:none}
}
</style>
</head>

  function pintarSon() { etiqueta(bSon, mudo ? I.mudo : I.son, mudo ? 'Sin sonido' : 'Sonido'); }

  /* ───────── abrir el sobre ───────── */
  var abriendo = false;
  function abrir() {
    if (abriendo) return; abriendo = true;
    musica.tocar();
    construir();
    if (reduce) { mostrarCarta(); verTodo(); return; }
    sobre.classList.add('abierto');
    setTimeout(function () { sobre.classList.add('sale'); }, 850);
    setTimeout(function () {
      var r = papelito.getBoundingClientRect();
      var cort = el('div', 'cortina');
      cort.style.left = r.left + 'px'; cort.style.top = r.top + 'px'; cort.style.width = r.width + 'px'; cort.style.height = r.height + 'px';
      document.body.appendChild(cort);
      void cort.offsetWidth;
      cort.style.left = '0px'; cort.style.top = '0px'; cort.style.width = '100%'; cort.style.height = '100%'; cort.style.borderRadius = '0';
      escena.classList.add('fuera');
      setTimeout(function () {
        mostrarCarta();
        cort.style.transition = 'opacity .5s ease'; cort.style.opacity = '0';
        setTimeout(function () { if (cort.parentNode) cort.parentNode.removeChild(cort); }, 600);
        empezar();
      }, 800);
    }, 1750);
  }
  function mostrarCarta() {
    escena.hidden = true; carta.hidden = false; window.scrollTo(0, 0);
    petalos.modo('carta');
    medir();
  }
  function empezar() {
    armarControles();
    corriendo = true; ult = 0; espera = 500;
    requestAnimationFrame(cuadro);
  }
  bAbrir.addEventListener('click', abrir);
  lacre.addEventListener('click', abrir);
  if (bProbar) {
    bProbar.addEventListener('click', function () { entrada.click(); });
    entrada.addEventListener('change', function () {
      var fs = Array.prototype.slice.call(entrada.files || []).filter(function (f) { return /^image\//.test(f.type); });
      if (!fs.length) return;
      cargarFotos(fs.map(function (f) { return { src: URL.createObjectURL(f), texto: '' }; }));
      bProbar.textContent = '✓ ' + fs.length + (fs.length === 1 ? ' foto cargada' : ' fotos cargadas') + ' (solo en este dispositivo)';
    });
  }
  var tRes; window.addEventListener('resize', function () { clearTimeout(tRes); tRes = setTimeout(function () { medir(); petalos.medir(); }, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(medir);

  /* ───────── pétalos ───────── */
  var petalos = (function () {
    var cv = document.getElementById('petalos'), ctx = cv.getContext && cv.getContext('2d');
    var api = { modo: function () {}, fiesta: function () {}, medir: function () {} };
    if (!ctx || reduce) { cv.style.display = 'none'; return api; }
    var dpr = Math.min(2, window.devicePixelRatio || 1), W = 0, H = 0, ps = [], cuantos = 1, hasta = 0, ultP = 0;
    var COL = [pal.acento2, pal.marcador.replace(/[\d.]+\)$/, '.9)'), '#ffe3e6', pal.acento];
    function nuevo(arriba) {
      return { x: Math.random() * W, y: arriba ? -20 - Math.random() * H * 0.4 : Math.random() * H, s: 5 + Math.random() * 8, vy: 24 + Math.random() * 40,
        vx: -8 + Math.random() * 16, a: Math.random() * 6.28, va: -1 + Math.random() * 2, f: Math.random() * 6.28, c: COL[(Math.random() * COL.length) | 0] };
    }
    api.medir = function () {
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = W < 600 ? 36 : 56; while (ps.length < n) ps.push(nuevo(false)); ps.length = n;
    };
    api.modo = function (m) { cuantos = m === 'carta' ? 0 : 1; };
    api.fiesta = function (seg) { hasta = Date.now() + seg * 1000; ps.forEach(function (p, i) { if (i % 2) { p.y = -20 - Math.random() * H * 0.5; } }); };
    function cuadroP(ts) {
      var dt = ultP ? Math.min(0.05, (ts - ultP) / 1000) : 0.016; ultP = ts;
      ctx.clearRect(0, 0, W, H);
      var fiesta = Date.now() < hasta, act = Math.round(ps.length * (fiesta ? 1 : cuantos * 0.6));
      for (var i = 0; i < ps.length; i++) {
        var p = ps[i];
        p.f += dt * 1.4; p.a += p.va * dt; p.y += p.vy * (fiesta ? 1.5 : 1) * dt; p.x += (p.vx + Math.sin(p.f) * 18) * dt;
        if (p.y > H + 20 || p.x < -30 || p.x > W + 30) ps[i] = p = nuevo(true);
        if (i >= act) continue;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, 0.55 + 0.45 * Math.abs(Math.sin(p.f)));
        ctx.globalAlpha = 0.9; ctx.fillStyle = p.c; ctx.beginPath();
        ctx.moveTo(0, -p.s); ctx.bezierCurveTo(p.s * 0.9, -p.s * 0.6, p.s * 0.7, p.s * 0.7, 0, p.s);
        ctx.bezierCurveTo(-p.s * 0.7, p.s * 0.7, -p.s * 0.9, -p.s * 0.6, 0, -p.s); ctx.fill(); ctx.restore();
      }
      requestAnimationFrame(cuadroP);
    }
    api.medir();
    requestAnimationFrame(cuadroP);
    return api;
  })();

  /* ───────── música: mp3 propio o cajita de música generada ───────── */
  var musica = (function () {
    var vol = cfgM.volumen != null ? cfgM.volumen : 0.85;
    var nada = { hay: false, tocar: function () {}, silenciar: function () {}, apagar: function () {} };
    if (cfgM.archivo) {
      var a = new Audio(cfgM.archivo), arranco = false; a.preload = 'auto'; a.volume = vol;
      return { hay: true,
        tocar: function () { if (!arranco) { try { a.currentTime = cfgM.desde || 0; } catch (e) {} arranco = true; } var pr = a.play(); if (pr && pr.catch) pr.catch(function () {}); },
        silenciar: function (m) { a.muted = m; },
        apagar: function () { var v = a.volume, t = setInterval(function () { v -= 0.05; if (v <= 0) { a.pause(); clearInterval(t); } else a.volume = v; }, 300); } };
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (cfgM.generada === false || !AC) return nada;
    var ac = null, master = null, rev = null, prox = 0, paso = 0, timer = null, silencio = false;
    var BEAT = 60 / 70, ACORDES = [[53, 57, 60], [50, 53, 57], [46, 50, 53], [48, 52, 55]];
    var ARP = [0, 1, 2, 3, 2, 1, 2, 1], MEL = [81, 0, 79, 77, 0, 77, 76, 0, 74, 0, 72, 74, 0, 77, 76, 0];
    function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function nota(m, t, dur, tipo, v, at) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = tipo; o.frequency.value = hz(m);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); g.connect(rev); o.start(t); o.stop(t + dur + 0.05);
    }
    function campana(m, t, v) { nota(m, t, 1.6, 'sine', v, 0.006); nota(m + 12, t, 0.7, 'sine', v * 0.25, 0.004); }
    function programar() {
      while (prox < ac.currentTime + 0.4) {
        var cmp = Math.floor(paso / 8) % 4, k = paso % 8, a0 = ACORDES[cmp];
        var tonos = [a0[0] + 12, a0[1] + 12, a0[2] + 12, a0[0] + 24];
        if (k === 0) { nota(a0[0] - 12, prox, BEAT * 4.2, 'sine', 0.07, 0.05); for (var i = 0; i < 3; i++) nota(a0[i], prox, BEAT * 4.4, 'triangle', 0.022, 0.9); }
        campana(tonos[ARP[k]], prox, 0.045);
        var ml = MEL[paso % 16]; if (paso >= 32 && ml && k % 2 === 0) campana(ml, prox + 0.01, 0.06);
        prox += BEAT / 2; paso++;
      }
    }
    return { hay: true,
      tocar: function () {
        try {
          if (!ac) {
            ac = new AC();
            master = ac.createGain(); master.gain.value = 0.0001; master.connect(ac.destination);
            var len = ac.sampleRate * 2.6, buf = ac.createBuffer(2, len, ac.sampleRate);
            for (var ch = 0; ch < 2; ch++) { var d = buf.getChannelData(ch); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
            var cvv = ac.createConvolver(); cvv.buffer = buf;
            rev = ac.createGain(); rev.gain.value = 0.32; rev.connect(cvv); cvv.connect(master);
            prox = ac.currentTime + 0.15;
          }
          if (ac.state === 'suspended' && ac.resume) ac.resume();
          master.gain.cancelScheduledValues(ac.currentTime);
          master.gain.setTargetAtTime(silencio ? 0.0001 : 0.55 * vol, ac.currentTime, 0.8);
          if (!timer) timer = setInterval(programar, 100);
          programar();
        } catch (e) {}
      },
      silenciar: function (m) { silencio = m; if (ac) master.gain.setTargetAtTime(m ? 0.0001 : 0.55 * vol, ac.currentTime, 0.3); },
      apagar: function () { if (!ac) return; master.gain.setTargetAtTime(0.0001, ac.currentTime, 2.5); setTimeout(function () { clearInterval(timer); timer = null; }, 10000); } };
  })();
})();
