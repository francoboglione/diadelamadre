        var ancho = j % 3 === 1 ? 92 : 80;
        var m = f.video ? '<video src="' + esc(f.src) + '"' + (f.poster ? ' poster="' + esc(f.poster) + '"' : '') + ' muted loop playsinline webkit-playsinline preload="metadata"></video>'
          : '<img src="' + esc(f.src) + '" alt="' + esc(f.texto || c.titulo) + '" loading="' + (i === 0 && j < 2 ? 'eager' : 'lazy') + '" decoding="async">';
        h += '<figure class="ct-foto rv' + (j % 2 ? ' par' : '') + '" style="width:' + ancho + '%;--r:' + rot + 'deg">' + m + (f.texto ? '<figcaption>' + esc(f.texto) + '</figcaption>' : '') + '</figure>';
      });
      h += '</div>' + (c.golpe ? '<div class="ct-golpe"><p>' + palabras(c.golpe, 0, 110) + '</p><div class="ct-dv">' + CZ + '</div></div>' : '') + '</section>';
    });
    h += '<section class="ct-final"><div class="ct-estallido"></div><p class="ct-msg rv">' + esc(cierre.mensaje || '') + '</p>' +
      '<p class="ct-gran ct-script rv">' + esc(cierre.titulo || 'Feliz día') + '</p><p class="ct-tag rv">Feliz Día de la Madre</p>' +
      (cierre.firma ? '<p class="ct-firma ct-script rv">' + esc(cierre.firma) + '</p>' : '') + '<div class="ct-latido rv">' + CZ + '</div>' +
      '<div class="ct-btns rv"><button class="ct-btn" type="button" data-acc="compartir">Compartir</button><button class="ct-btn sec" type="button" data-acc="otra">Ver de nuevo</button></div></section></div>';
    w.innerHTML = h;
    app.appendChild(w);
    lluvia($('.ct-hero', w), 7, false);

    var bar = $('.ct-bar', w), pill = $('.ct-pill', w), secs = w.querySelectorAll('.ct-cap'), finalSec = $('.ct-final', w);
    var explotado = false;
    function revelar(e) {
      if (e.className.indexOf(' in') > -1) return;
      e.className += ' in';
      if (e.tagName === 'FIGURE') { var v = $('video', e); if (v) { try { var p = v.play(); if (p && p.then) p.then(function () {}, function () {}); } catch (x) {} } }
    }
    var obs = w.querySelectorAll('.rv,.ct-golpe');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (ents) {
        cada(ents, function (en) {
          if (!en.isIntersecting) return;
          revelar(en.target); io.unobserve(en.target);

            explotado = true;
            var es = $('.ct-estallido', w), r = es.getBoundingClientRect(), rr = en.target.getBoundingClientRect();
            setTimeout(function () { estallido(es, r.width / 2, rr.top - r.top + rr.height / 2, 28, ['#B04783', '#DFA0C4', '#6B2450', '#F4C7C3']); }, 300);
            Musica.fade(0.7, 4000);

      cada(obs, function (o) { io.observe(o); });
    } else cada(obs, revelar);

    var pend = false;
    function scroll() {

      bar.style.webkitTransform = bar.style.transform = 'scaleX(' + (alto > 0 ? Math.min(1, y / alto) : 0) + ')';
      var act = -1, lim = window.innerHeight * 0.45;
      cada(secs, function (s, i) { if (s.getBoundingClientRect().top < lim) act = i; });
      if (finalSec.getBoundingClientRect().top < lim) act = -1;
      if (act >= 0) { pill.textContent = dos(act + 1) + ' / ' + dos(caps.length) + ' · ' + caps[act].titulo; pill.className = 'ct-pill ver'; }
      else pill.className = 'ct-pill';
    }
    window.addEventListener('scroll', function () { if (!pend) { pend = true; requestAnimationFrame(scroll); } }, { passive: true });
    window.addEventListener('resize', scroll);
    w.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      var acc = b.getAttribute('data-acc');
      if (acc === 'compartir') compartir();
      else if (acc === 'otra') { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (x) { window.scrollTo(0, 0); } Musica.reiniciar(); }
    });

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    document.body.style.overflow = 'hidden';
    puerta('ct-sobre-p', '<div><div class="ct-sobre"><div class="cuerpo"><div class="carta">' + esc(para) + '</div><div class="frente"></div><div class="solapa"></div><div class="ct-sello">' + CZ + '</div></div></div>' +
      '<p class="ct-para">Para ' + esc(para) + ', con amor</p><p class="ct-toca">Tocá para abrir &middot; con sonido</p></div>',
      function (p, cerrar) {
        setTimeout(function () { document.body.style.overflow = ''; root.className += ' iniciado'; cerrar(); }, reduce ? 50 : 1700);
      });
  }

  /* ════════════════════════════════════════════════════════
     TEMA · ÁLBUM
     ════════════════════════════════════════════════════════ */
  function temaAlbum() {
    var pasos = armarPasos(false);
    var grupos = [];
    cada(pasos, function (p) { var g = p.tipo === 'cierre' ? caps.length : p.cap; (grupos[g] = grupos[g] || []).push(p); });
    var CINTAS = ['rgba(244,214,160,.75)', 'rgba(198,222,214,.8)', 'rgba(240,190,190,.75)', 'rgba(214,204,236,.8)'];
    var w = el('div', 'al noselect');
    var pts = ''; cada(caps, function () { pts += '<i></i>'; });
    w.innerHTML = '<div class="al-top"><span class="al-lbl">Nuestro álbum</span><b class="al-tit">Para ' + esc(para) + '</b><div class="al-puntos">' + pts + '</div></div>' +
      '<div class="al-mazo"></div><div class="al-ctrl"><button class="al-b" type="button" data-acc="ant" aria-label="Anterior">&#8630;</button>' +
      '<span class="al-hint">Deslizá la foto <span class="fl">&rarr;</span></span><button class="al-b prin" type="button" data-acc="sig" aria-label="Siguiente">&rarr;</button></div>';
    app.appendChild(w);
    var mazo = $('.al-mazo', w), lbl = $('.al-lbl', w), tit = $('.al-tit', w), puntos = w.querySelectorAll('.al-puntos i'), hint = $('.al-hint', w), ctrl = $('.al-ctrl', w);
    var g = 0, pos = 0, cartas = [], ocupado = false, yaDeslizo = false;

    function carta(p) {
      var c = caps[p.cap], h, rot = (Math.random() * 10 - 5).toFixed(1);
      if (p.tipo === 'capitulo') h = '<div class="al-ficha"><p class="al-eye">Capítulo ' + (p.cap + 1) + ' de ' + caps.length + '</p><h2>' + esc(c.titulo) + '</h2><p>' + esc(c.frase) + '</p></div>';
      else if (p.tipo === 'foto') h = '<div class="al-polaroid"><div class="al-cinta" style="background:' + CINTAS[(p.cap + p.j) % CINTAS.length] + ';-webkit-transform:rotate(' + (Math.random() * 8 - 4).toFixed(1) + 'deg);transform:rotate(' + (Math.random() * 8 - 4).toFixed(1) + 'deg)"></div><div class="img">' + media(p.f, '') + '</div><p>' + esc(p.f.texto || '') + '</p></div>';
      else h = '<div class="al-nota"><p>' + palabras(p.texto, 250, 120) + '</p><div class="al-cz">' + CZ + '</div></div>';
      var e = el('div', 'al-carta', h);
      e.setAttribute('data-rot', rot);
      return e;
    }
    function tr(e, x, y, r, s) { var v = 'translate(-50%,-50%) translate(' + x + 'px,' + y + 'px) rotate(' + r + 'deg)' + (s ? ' scale(' + s + ')' : ''); e.style.webkitTransform = e.style.transform = v; }
    function apilar() {
      cada(cartas, function (e, k) {
        if (k < pos) return;
        var prof = k - pos;
        e.style.zIndex = 100 - k;
        e.style.opacity = prof > 3 ? '0' : '1';
        tr(e, prof * 3, prof * 5, +e.getAttribute('data-rot') * (prof ? 1 : 0.35), 1 - prof * 0.02);
      });
      var top = cartas[pos];
      if (top) { var n = $('.al-nota', top); if (n) setTimeout(function () { n.className += ' on'; }, 200); reproducirVideos(top); }
    }
    function etiqueta() {
      var c = caps[g];
      lbl.textContent = c ? 'Capítulo ' + (g + 1) + ' de ' + caps.length : 'Nuestro álbum';
      tit.textContent = c ? c.titulo : 'Para ' + para;
      cada(puntos, function (p, k) { p.className = k <= g ? 'si' : ''; });
      $('[data-acc="ant"]', w).disabled = g === 0 && pos === 0;
    }
    function armarGrupo(n, desdeFin) {
      mazo.innerHTML = ''; cartas = [];
      g = n;
      if (g >= caps.length) { finalAlbum(); etiqueta(); return; }
      cada(grupos[g], function (p) { cartas.push(carta(p)); });
      pos = desdeFin ? cartas.length - 1 : 0;
      cada(cartas, function (e, k) {
        if (k < pos) return;
        mazo.appendChild(e);
        e.style.zIndex = 100 - k;
        tr(e, (Math.random() - 0.5) * 120, -window.innerHeight * 1.1, Math.random() * 40 - 20);
      });
      void mazo.offsetWidth;
      cada(cartas, function (e, k) {
        if (k < pos) return;
        e.className += ' anim';
        e.style.webkitTransitionDelay = e.style.transitionDelay = ((cartas.length - k) * 70) + 'ms';
        setTimeout(function () { e.style.webkitTransitionDelay = e.style.transitionDelay = '0ms'; }, 900);
      });
      apilar();
      etiqueta();
      cada(grupos[g], function (p) { if (p.f) precargar(imgDe(p.f)); });
      if (grupos[g + 1]) cada(grupos[g + 1], function (p) { if (p.f) precargar(imgDe(p.f)); });
    }
    function tirar(dir) {
      if (ocupado) return;
      if (g >= caps.length) return;
      var e = cartas[pos];
      if (!e) return;
      ocupado = true;
      if (!yaDeslizo) { yaDeslizo = true; hint.style.opacity = '0'; }
      e.className = 'al-carta vuela';
      tr(e, dir * window.innerWidth * 1.2, -60 + Math.random() * 120, dir * (24 + Math.random() * 16));
      e.style.opacity = '0';
      cada(e.querySelectorAll('video'), function (v) { v.pause(); });
      pos++;
      setTimeout(function () {
        if (e.parentNode) e.parentNode.removeChild(e);
        ocupado = false;
        if (pos >= cartas.length) armarGrupo(g + 1); else { apilar(); etiqueta(); }
      }, pos >= cartas.length ? 420 : 160);
      if (pos < cartas.length) { apilar(); etiqueta(); }
    }
    function volver() {
      if (ocupado) return;
      if (g >= caps.length) { cerrarFinal(); armarGrupo(caps.length - 1, true); return; }
      if (pos === 0) { if (g > 0) armarGrupo(g - 1, true); return; }
      pos--;
      var e = cartas[pos];
      e.className = 'al-carta';
      e.style.opacity = '1';
      tr(e, -window.innerWidth, 0, -30);
      mazo.appendChild(e);
      void e.offsetWidth;
      e.className = 'al-carta anim';
      apilar(); etiqueta();
    }

    /* arrastrar la carta de arriba */
    var arr = null;
    function inicio(x, y, ev) {
      var t = ev.target;
      if (t && t.closest && t.closest('button,a')) return;
      if (g >= caps.length || ocupado) return;
      var e = cartas[pos]; if (!e) return;
      arr = { e: e, x0: x, y0: y, dx: 0, dy: 0, t: ahora(), rot: +e.getAttribute('data-rot') * 0.35 };
      e.className = 'al-carta';
    }
    function mover(x, y) {
      if (!arr) return;
      arr.dx = x - arr.x0; arr.dy = y - arr.y0;
      tr(arr.e, arr.dx, arr.dy, arr.rot + arr.dx * 0.06);
    }
    function soltar() {
      if (!arr) return;
      var a = arr; arr = null;
      var v = Math.abs(a.dx) / Math.max(1, ahora() - a.t);
      if (Math.abs(a.dx) < 8 && Math.abs(a.dy) < 8) { a.e.className = 'al-carta anim'; tirar(1); return; }
      if (Math.abs(a.dx) > 90 || v > 0.6) { tirar(a.dx > 0 ? 1 : -1); return; }
      a.e.className = 'al-carta anim'; apilar();
    }
    if (window.PointerEvent) {
      mazo.addEventListener('pointerdown', function (e) { if (e.button > 0) return; inicio(e.clientX, e.clientY, e); try { mazo.setPointerCapture(e.pointerId); } catch (x) {} });
      mazo.addEventListener('pointermove', function (e) { mover(e.clientX, e.clientY); });
      mazo.addEventListener('pointerup', soltar);
      mazo.addEventListener('pointercancel', soltar);
    } else {
      mazo.addEventListener('touchstart', function (e) { var t = e.touches[0]; inicio(t.clientX, t.clientY, e); }, { passive: true });
      mazo.addEventListener('touchmove', function (e) { var t = e.touches[0]; mover(t.clientX, t.clientY); if (arr) e.preventDefault(); }, { passive: false });
      mazo.addEventListener('touchend', soltar);
      mazo.addEventListener('mousedown', function (e) { inicio(e.clientX, e.clientY, e); });
      window.addEventListener('mousemove', function (e) { mover(e.clientX, e.clientY); });
      window.addEventListener('mouseup', soltar);
    }
    teclas({ sig: function () { tirar(1); }, ant: volver });
    w.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      var acc = b.getAttribute('data-acc');
      if (acc === 'sig') tirar(1); else if (acc === 'ant') volver();
      else if (acc === 'otra') { cerrarFinal(); Musica.reiniciar(); armarGrupo(0); }
      else if (acc === 'compartir') compartir();
    });

    /* final: todas las fotos forman un corazón */
    var fin = null;
    function cerrarFinal() { if (fin && fin.parentNode) fin.parentNode.removeChild(fin); fin = null; ctrl.style.display = ''; }
    function finalAlbum() {
      ctrl.style.display = 'none';
      Musica.fade(0.7, 4000);
      fin = el('div', 'al-final');
      var W = Math.min(window.innerWidth, 640), Hh = window.innerHeight;
      var esc2 = Math.min(W * 0.86 / 34, Hh * 0.56 / 32);
      var ancho = esc2 * 34, alto = esc2 * 32;
      var cz = el('div', 'al-corazon'); cz.style.width = ancho + 'px'; cz.style.marginTop = (Math.max(70, (Hh - alto) * 0.28) + 20) + 'px';
      var fotos = []; cada(todas, function (f) { if (imgDe(f)) fotos.push(imgDe(f)); });
      var n = Math.max(16, Math.min(26, fotos.length * 2)), lado = Math.max(40, Math.min(78, esc2 * 4.6));
      cz.style.height = (alto + lado * 0.9) + 'px';
      for (var k = 0; k < n && fotos.length; k++) {
        var t = k / n * Math.PI * 2;
        var x = 16 * Math.pow(Math.sin(t), 3), y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        var m = el('div', 'al-mini', '<span></span>');
        m.firstChild.style.backgroundImage = url(fotos[k % fotos.length]);
        m.style.width = lado + 'px'; m.style.height = (lado + 8) + 'px';
        m.style.left = (ancho / 2 + x * esc2 - lado / 2) + 'px'; m.style.top = (alto * 0.44 + y * esc2 - lado / 2) + 'px';
        var dx = (Math.random() - 0.5) * W * 2, dy = (Math.random() < 0.5 ? -1 : 1) * Hh;
        m.style.webkitTransform = m.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 90 - 45) + 'deg)';
        m.style.webkitTransitionDelay = m.style.transitionDelay = (k * 55) + 'ms';
        m.setAttribute('data-r', (Math.random() * 16 - 8).toFixed(1));
        cz.appendChild(m);
      }
      cz.insertAdjacentHTML('beforeend', '<div class="al-centro"><h2>' + esc(cierre.titulo || 'Feliz día') + '</h2>' + (cierre.firma ? '<p>' + esc(cierre.firma) + '</p>' : '') + '</div>');
      fin.appendChild(cz);
      fin.appendChild(el('div', 'al-pie', '<p>' + esc(cierre.mensaje || '') + '</p><div class="al-bs"><button class="al-bt" type="button" data-acc="otra">&#8635; Ver de nuevo</button><button class="al-bt sec" type="button" data-acc="compartir">Compartir</button></div>'));
      w.appendChild(fin);
      void fin.offsetWidth;
      cada(cz.querySelectorAll('.al-mini'), function (m) { m.style.webkitTransform = m.style.transform = 'rotate(' + m.getAttribute('data-r') + 'deg)'; });
      fin.className += ' on';
      setTimeout(function () { if (fin) estallido(fin, window.innerWidth / 2, Hh * 0.4, 24, ['#b5523b', '#e2a39a', '#f0c27a', '#fffdf8']); }, 1600);
    }

    puerta('al-puerta', '<div><div class="al-tapa"><div class="marco"><p class="al-eye">Nuestro álbum</p><h1>Para ' + esc(para) + '</h1><p>' + esc(portada.titulo || '') + '</p><div class="al-cz">' + CZ + '</div></div></div>' +
      '<p class="al-toca" style="color:#6b4b36">Tocá para abrir &middot; con sonido</p></div>',
      function (p, cerrar) { setTimeout(function () { armarGrupo(0); cerrar(); }, reduce ? 50 : 700); });
  }

  /* ---------- arrancar ---------- */
  ({ historias: temaHistorias, cine: temaCine, carta: temaCarta, album: temaAlbum })[tema]();
})();
