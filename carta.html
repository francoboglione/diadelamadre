<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tenés una carta 💌</title>
<meta name="description" content="Una carta animada para el Día de la Madre: se abre el sobre, se escribe sola y caen las fotos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3a1f2b">
<meta property="og:title" content="Tenés una carta 💌">
<meta property="og:description" content="Abrila con el volumen alto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Kalam:wght@400;700&family=Figtree:wght@400;600&display=swap">
<style>
/* Carta para mamá · un sobre que se abre, una carta que se escribe sola y fotos que caen. Licencia MIT. */
:root{
  --fondo:#3a1f2b; --fondo2:#5a2b3c; --papel:#fff8f2; --papel2:#f6ece2; --tinta:#3b2330; --suave:#7a5b68;
  --acento:#c9506e; --acento2:#f0b3a6; --marcador:rgba(242,160,184,.55); --lacre:#b2334f; --sobre:#f3d3cf;
  --linea:rgba(59,35,48,.11); --margen:rgba(201,80,110,.35);
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --mano:"Kalam","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --ui:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --lh:34px; --izq:58px;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{background:var(--fondo);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--fondo);color:var(--tinta);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acento2);outline-offset:3px}
[hidden]{display:none!important}
.fondo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;background:radial-gradient(120% 80% at 50% 0%,var(--fondo2),var(--fondo) 70%)}
#petalos{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:8}

/* ── el sobre ── */
.escena{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top, 0px)) var(--gr) calc(24px + env(safe-area-inset-bottom, 0px)) var(--gl);transition:opacity .5s ease}
.escena > * + *{margin-top:26px}
.escena .ojo{margin:0;font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--acento2)}
.sobre{position:relative;width:min(86vw,420px);perspective:1200px;animation:llega 1.1s cubic-bezier(.2,.8,.2,1) both}
.sobre::before{content:"";display:block;padding-top:70%}
@keyframes llega{from{transform:translateY(40px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.sobre-atras{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:6px;background:var(--sobre);filter:brightness(.9);box-shadow:0 30px 60px -24px rgba(0,0,0,.65)}
.papelito{position:absolute;left:7%;right:7%;top:8%;height:84%;z-index:1;border-radius:3px;background-color:var(--papel);
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent 13px,var(--linea) 13px,var(--linea) 14px);background-position:0 20px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.bolsillo{position:absolute;top:0;right:0;bottom:0;left:0;z-index:2;border-radius:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6%;
  background:linear-gradient(165deg,rgba(255,255,255,.28),transparent 45%),var(--sobre);
  -webkit-clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%);clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%)}
.para-sobre{font-family:var(--mano);font-weight:700;font-size:clamp(22px,6.4vw,34px);line-height:1.1;color:var(--tinta)}
.de-sobre{margin-top:4px;font-family:var(--mano);font-size:clamp(14px,3.9vw,18px);color:var(--suave)}
.solapa{position:absolute;left:0;right:0;top:0;height:52%;z-index:3;transform-origin:50% 0;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));
  transition:transform .8s cubic-bezier(.4,.1,.2,1),z-index 0s .36s}
.solapa i{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--sobre),var(--sobre));filter:brightness(.96);
  -webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%)}
.lacre{position:absolute;left:50%;top:52%;z-index:4;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.38),transparent 46%),var(--lacre);
  box-shadow:0 5px 12px rgba(0,0,0,.35),inset 0 -3px 7px rgba(0,0,0,.28),0 0 0 5px rgba(0,0,0,.06);transition:transform .35s ease,opacity .35s ease}
.lacre svg{width:22px;height:22px;fill:rgba(255,255,255,.88)}
.lacre:hover{transform:scale(1.06)}
.abierto .lacre{transform:scale(1.5);opacity:0;pointer-events:none}
.abierto .solapa{transform:rotateX(180deg);z-index:0}
.sale .papelito{transform:translateY(-64%)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:15px 28px;font-size:17px;font-weight:600;cursor:pointer;
  background:var(--papel);color:var(--tinta);box-shadow:0 14px 30px -14px rgba(0,0,0,.6);transition:transform .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:18px;height:18px;fill:currentColor;margin-right:10px;flex:0 0 auto}
.escena .nota{margin:14px 0 0;font-size:13px;color:rgba(255,255,255,.72)}
.probar{border:1px dashed rgba(255,255,255,.45);background:none;color:rgba(255,255,255,.85);border-radius:999px;padding:10px 18px;font-size:14px;cursor:pointer}
.cancion{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--acento2);border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;color:#fff;text-decoration:none;background:rgba(255,255,255,.06)}
.escena .cancion-nota{margin:10px 0 0;font-size:12.5px;color:rgba(255,255,255,.62);max-width:300px;line-height:1.4}
.escena.fuera{opacity:0;pointer-events:none}
.cortina{position:fixed;z-index:6;background:var(--papel);border-radius:3px;transition:all .75s cubic-bezier(.6,0,.2,1)}

/* ── la carta ── */
.carta{position:relative;z-index:1;max-width:720px;margin:0 auto;min-height:100vh;overflow-x:hidden;overflow-x:clip;
  background-color:var(--papel);
  background-image:linear-gradient(90deg,transparent calc(var(--izq) - 16px),var(--margen) calc(var(--izq) - 16px),var(--margen) calc(var(--izq) - 15px),transparent calc(var(--izq) - 15px)),
    repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--lh) - 1px),var(--linea) calc(var(--lh) - 1px),var(--linea) var(--lh));
  background-position:0 0,0 -7px;
  padding:calc(var(--lh) * 2 + env(safe-area-inset-top, 0px)) var(--gr) calc(var(--lh) * 4 + env(safe-area-inset-bottom, 0px)) var(--izq);
  box-shadow:0 0 90px rgba(0,0,0,.35);font-family:var(--mano);font-size:20px;line-height:var(--lh);color:var(--tinta)}
.carta p{margin:0 0 var(--lh)}
.fecha{text-align:right;color:var(--suave)}
.saludo{font-weight:700;font-size:23px}
.c{opacity:0}
.c.t{opacity:1;transition:opacity .18s ease}
.pluma{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.16em;background:var(--acento);animation:titila 1s steps(2) infinite}
@keyframes titila{50%{opacity:0}}
.palabra{white-space:nowrap}
.marca{background-image:linear-gradient(var(--marcador),var(--marcador));background-repeat:no-repeat;background-size:0% 60%;background-position:0 80%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size 1.3s ease;padding:0 .08em}
.marca.on{background-size:100% 60%}
.lista{list-style:none;margin:0 0 var(--lh);padding:0}
.lista li{position:relative;padding-left:1.25em}
.lista li::before{content:"♥";position:absolute;left:0;color:var(--acento);opacity:0;transition:opacity .4s}
.lista li.on::before{opacity:1}
.firma{text-align:right;font-weight:700}
.firma > span{display:block}
.pd{color:var(--suave);font-size:18px}

/* bloques que cortan la escritura: alto en múltiplos del renglón */
.bloque{position:relative;margin:0 0 var(--lh) calc(16px - var(--izq))}
.grande{text-align:center;font-family:var(--display);font-weight:400;color:var(--acento);font-size:clamp(46px,12.5vw,88px);line-height:1;letter-spacing:-.01em;
  display:flex;flex-direction:column;justify-content:center;opacity:0;transform:scale(.92);transition:opacity 1.2s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.grande.on{opacity:1;transform:none}
.grande small{display:block;margin-top:.25em;font-family:var(--mano);font-size:.36em;color:var(--suave);letter-spacing:0}

/* polaroid con cinta */
.pol{--alto:0;position:absolute;left:50%;top:50%;width:var(--w);margin:0;visibility:hidden;
  background:linear-gradient(160deg,#fffdf9,#f3ece2);padding:calc(var(--w) * .055) calc(var(--w) * .055) 0;border-radius:2px;
  box-shadow:0 calc(6px + var(--alto) * 40px) calc(14px + var(--alto) * 36px) -10px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.22)}
.pol::before{content:"";position:absolute;z-index:2;left:50%;top:calc(var(--w) * -.05);width:calc(var(--w) * .36);height:calc(var(--w) * .11);
  transform:translateX(-50%) rotate(-3deg);background:var(--acento2);opacity:.75;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pol:nth-child(even)::before{transform:translateX(-44%) rotate(4deg);background:#fff3d6}
.pol .foto{position:relative;padding-top:118%;overflow:hidden;background:var(--papel2)}
.pol .foto img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.pol figcaption{font-family:var(--mano);color:#3b2a30;font-size:calc(var(--w) * .085);line-height:1.1;min-height:calc(var(--w) * .2);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 6px}
.pol.rota{display:none}
.pol.vuela{visibility:visible;will-change:transform;transition:transform .78s cubic-bezier(.22,.85,.3,1.14)}
.pol.ya{visibility:visible}
.corazon .pol{padding:calc(var(--w) * .07) calc(var(--w) * .07) calc(var(--w) * .2)}
.corazon .pol .foto{padding-top:100%}
.corazon .pol::before{display:none}

/* carrusel */
.carrusel{margin-left:calc(-1 * var(--izq));margin-right:calc(-1 * var(--gr));overflow:hidden;padding:18px 0 10px}
.fila{opacity:0;transform:translateX(26%);transition:opacity 1s ease,transform 1.3s cubic-bezier(.2,.7,.2,1)}
.fila.rev{transform:translateX(-26%)}
.fila.on{opacity:1;transform:none}
.fila + .fila{margin-top:16px}
.tira{display:flex;width:max-content;padding:0 8px;will-change:transform;animation:desliza var(--dur,40s) linear infinite}
.carrusel.quieto .tira{animation-play-state:paused}
.fila.rev .tira{animation-direction:reverse}
.tira .pol{margin-right:16px;position:relative;left:auto;top:auto;flex:0 0 auto;visibility:visible;transform:rotate(var(--r))}
.tira .pol .foto{padding-top:100%}
@keyframes desliza{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* poema */
.estrofa{margin:0 0 var(--lh);padding-left:.8em;border-left:3px solid var(--acento2);color:var(--tinta)}
.carta .estrofa p{margin:0}
/* regalos */
.regalos-tit{font-weight:700}
.regalos{padding:4px 0 6px}
.regalo + .regalo{margin-top:14px}
.regalo{display:grid;perspective:900px;opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.regalo.on{opacity:1;transform:none}
.regalo[role=button]{cursor:pointer}
.cara{grid-area:1/1;background:#fffdfb;border:1.5px solid var(--acento2);border-radius:16px;padding:16px 16px 14px;line-height:1.4;font-size:.95em;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 16px 30px -20px rgba(0,0,0,.5);-webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .35s ease;display:flex;flex-direction:column;justify-content:center}
.cara > * + *{margin-top:8px}
.cara p{margin:0}
.atras{transform:rotateY(-180deg);opacity:0;background:var(--papel2);text-align:center;align-items:center}
.vuelta .frente{transform:rotateY(180deg);opacity:0}
.vuelta .atras{transform:none;opacity:1}
.reg-top{display:flex;align-items:center}
.reg-ico{margin-right:10px}
.reg-ico{font-size:28px;line-height:1}
.reg-top h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;color:var(--acento)}
.hecho .frente{background:var(--papel2)}
.chip{align-self:flex-start;font-family:var(--ui);font-size:12.5px;font-weight:600;letter-spacing:.02em;border-radius:999px;padding:6px 12px;background:var(--acento);color:#fff}
.chip.ok{background:none;color:var(--acento);border:1.5px solid var(--acento2)}
.atras .chip{align-self:center;background:none;color:var(--suave);border:1px solid var(--linea)}
.cuenta{font-family:var(--display);color:var(--acento);font-size:24px}
.reg-foto{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;border-radius:10px;background:var(--papel2)}
/* línea de tiempo */
.hitos-tit{font-weight:700}
.hitos-foto{display:block;margin:6px auto 22px;width:86%;max-width:380px;background:#fffdf9;padding:10px 10px 0;border-radius:3px;
  box-shadow:0 16px 32px -16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.2);opacity:0;transform:rotate(-2deg) translateY(24px) scale(.92);
  transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1.15)}
.hitos-foto.on{opacity:1;transform:rotate(-2deg)}
.hitos-foto img{display:block;width:100%;height:auto;max-height:440px;object-fit:cover;background:var(--papel2)}
.hitos-foto figcaption{font-family:var(--mano);text-align:center;padding:8px 6px 10px;color:#3b2a30;font-size:.92em;line-height:1.25}
.hito-foto{display:block;width:100%;max-width:300px;height:auto;max-height:230px;object-fit:cover;border-radius:10px;margin-top:8px;background:var(--papel2)}
.cifras{display:flex;flex-wrap:wrap;justify-content:center;padding:6px 0 4px}
.cifra{flex:1 1 70px;text-align:center;padding:4px 6px}
.cifra b{display:block;font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--acento)}
.cifra span{font-family:var(--ui);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.linea{list-style:none;margin:10px 0 0;padding:0 0 0 26px;position:relative}
.linea::before{content:"";position:absolute;left:8px;top:6px;bottom:10px;width:2px;background:var(--acento2)}
.hito{position:relative;padding:0 0 18px;opacity:0;transform:translateX(14px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.hito.on{opacity:1;transform:none}
.hito::before{content:"";position:absolute;left:-24px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--papel);border:3px solid var(--acento)}
.hito.logro::before{background:var(--acento)}
.hito-fecha{display:block;font-family:var(--ui);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acento)}
.hito-tit{display:block;font-family:var(--display);font-size:22px;line-height:1.2;color:var(--tinta)}
.hito-txt{display:block;font-size:.92em;line-height:1.4;color:var(--suave)}
/* lectura grande: para abuelas y celulares chicos */
.letra-grande .carta{font-size:23px;--lh:38px}
.letra-grande .saludo{font-size:26px}
.letra-grande .controles button{font-size:16px;padding:13px 16px}
.letra-grande .chip{font-size:14.5px;padding:8px 14px}
/* modo liviano: celulares con poca memoria */
.liviano .pol{box-shadow:0 2px 6px rgba(0,0,0,.3)}
.liviano .controles{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(20,14,18,.92)}
.perras{width:min(220px,80%);height:auto;margin:2px auto 0}
.flor-sep{display:flex;justify-content:center;align-items:center;opacity:.85}
.flor-sep svg{width:120px;height:68px}

.fin{text-align:center;font-family:var(--ui);font-size:16px;line-height:1.5}
.fin .btn{background:var(--acento);color:#fff}
.hacer{margin:calc(var(--lh) * 2) 0 0;text-align:left;font-family:var(--ui);font-size:15px;line-height:1.55;color:var(--suave);background:var(--papel2);border-radius:14px;padding:18px 18px 16px}
.hacer b{color:var(--tinta)}
.hacer a{color:var(--acento)}

/* controles */
.controles{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;padding:6px;border-radius:999px;
  background:rgba(20,14,18,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.controles button + button{margin-left:6px}
.controles button{display:inline-flex;align-items:center;border:0;border-radius:999px;padding:10px 14px;background:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.controles button:hover{background:rgba(255,255,255,.12)}
.controles svg{width:15px;height:15px;fill:currentColor;margin-right:7px}

@media (max-width:420px){
  :root{--lh:31px;--izq:46px}
  .carta{font-size:18.5px}
  .saludo{font-size:21px}
  .pd{font-size:17px}
  .controles button{padding:10px 11px;font-size:13px}
}
@media (max-width:420px){
  .letra-grande .carta{font-size:21px;--lh:35px}
  .letra-grande .saludo{font-size:23px}
  .letra-grande .controles button{font-size:15px;padding:12px 13px}
}
@media (prefers-reduced-motion:reduce){
  .hito,.hitos-foto{transition:none}
  .sobre{animation:none}
  .tira{animation:none}
  .carrusel{overflow-x:auto}
  .pluma{animation:none}
  .cara,.regalo{transition:none}
}
</style>
</head>
<body>
<script>
/* ═══════════════════════════════════════════════════════════════════
   TUS DATOS · es lo único que se cambia (todo lo demás es el motor)
   ───────────────────────────────────────────────────────────────────
   para     cómo le dicen: "mamá", "ma", "mami" o su nombre
   de       quiénes firman: "Lucía, Tomi y Juli"
   hijos    cuántos firman (1 = textos en singular, 2 o más = plural)
   fecha    lo que va arriba a la derecha de la carta
   paleta   "rosa" · "lavanda" · "durazno" · "salvia" · "cielo" · "noche"
   textos   saludo, intro, recuerdos, antesDestacado, destacado, gracias (lista),
            final, cierre, sub, firma, pd. Lo que no pongas se completa solo.
   fotos    [{ "src": "...", "texto": "pie de foto" }]  (src puede ser
            data:image/jpeg;base64,..., una ruta como fotos/01.jpg, un link
            de Google Drive público o cualquier link a una imagen)
   musica   { "archivo": "cancion.mp3" } o vacío para la cajita de música
   velocidad 1 = normal; 1.5 = más rápida; 0.7 = más lenta
   {para} dentro de un texto se reemplaza por el nombre.
   Atajo: agregá #Nombre al final del link y la carta dice "Querida Nombre".
   ═══════════════════════════════════════════════════════════════════ */
/*CARTA:INICIO*/
window.CARTA = {
  "para": "mamá",
  "de": "",
  "hijos": 2,
  "fecha": "Domingo 18 de octubre",
  "paleta": "rosa",
  "textos": {},
  "fotos": [],
  "musica": { "archivo": "", "generada": true },
  "mostrarComoHacerla": false
};
/*CARTA:FIN*/
</script>
<div class="fondo" aria-hidden="true"></div>
<canvas id="petalos" aria-hidden="true"></canvas>
<div id="app"></div>
<noscript><p style="position:relative;z-index:2;color:#fff;text-align:center;padding:40vh 24px;font-family:sans-serif">Esta carta necesita JavaScript para abrirse.</p></noscript>

<script>
/* ═════════════════ MOTOR · no hace falta tocarlo ═════════════════ */
(function () {
  'use strict';
